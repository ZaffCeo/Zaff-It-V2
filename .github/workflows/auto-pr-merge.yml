name: Auto PR + Merge

# Arena session pipeline:
#   1. Push to arena/** -> workflow tries to open a PR (needs repo setting
#      "Allow GitHub Actions to create and approve pull requests"), then merges it.
#   2. Any PR opened from arena/** -> workflow merges it immediately.
#   3. Merge to main -> Vercel Git integration auto-deploys (project "zaff-it",
#      repo ZaffCeo/Zaff-It-V2).

on:
  push:
    branches:
      - 'arena/**'
  pull_request:
    branches:
      - 'arena/**'
      - main
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  auto-pr-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure PR exists
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            if PR_URL=$(gh pr create --base main --head "$BRANCH" \
                --title "Auto: $(git log -1 --pretty=%s)" \
                --body "Automated PR — pipeline: push → PR → merge → Vercel auto-deploy." 2>&1); then
              PR="${PR_URL##*/}"
            else
              echo "::notice::PR create via GITHUB_TOKEN blocked by repo settings (enable 'Allow GitHub Actions to create and approve pull requests'). Agent/founder PR will trigger the merge on open."
              PR=""
            fi
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Merge PR (if present)
        if: steps.pr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ steps.pr.outputs.pr }}"
          if [ -z "$PR" ]; then
            echo "No PR to merge."
            exit 0
          fi
          echo "Merging PR #$PR"
          gh pr merge "$PR" --merge || { sleep 5; gh pr merge "$PR" --merge; }
          echo "PR #$PR merged — Vercel will auto-deploy main."

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript check (apps/mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: apps/mobile
        run: npm install --legacy-peer-deps

      - name: tsc --noEmit
        working-directory: apps/mobile
        run: npx tsc --noEmit

  function-lint:
    name: Edge function syntax (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno check all functions
        run: |
          fail=0
          for f in supabase/functions/*/index.ts; do
            echo "checking $f"
            deno check "$f" || fail=1
          done
          exit $fail
